name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"      # weekly, Monday 03:00 UTC
  workflow_dispatch:

jobs:
  suite:
    name: validation suite (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validation suite (checks needing undistributed data report NOT RUN; any FAIL fails the job)
        env:
          PYTHONIOENCODING: utf-8
        run: python checks/run_all_checks.py
